name: Tests

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  django-tests:
    name: Django Test Suite
    runs-on: ubuntu-latest

    # PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_habot_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Django settings
      SECRET_KEY: django-insecure-test-key-only-for-ci
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

      # Database settings (point to service container)
      DB_NAME: test_habot_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432

      # Test-specific settings
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1

    steps:
      # ------------------------------------------------------------------
      # Step 1: Checkout repository code
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Step 2: Set up Python 3.11
      # ------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------------------
      # Step 3: Install dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Step 4: Verify PostgreSQL is ready
      # ------------------------------------------------------------------
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      # ------------------------------------------------------------------
      # Step 5: Run Django system checks
      # These catch configuration errors, missing apps, URL conflicts, etc.
      # ------------------------------------------------------------------
      - name: Run Django system checks
        run: |
          python manage.py check --deploy --fail-level ERROR

      # ------------------------------------------------------------------
      # Step 6: Run database migrations
      # Ensures schema is up-to-date before tests run
      # ------------------------------------------------------------------
      - name: Run migrations
        run: |
          python manage.py migrate --run-syncdb

      # ------------------------------------------------------------------
      # Step 7: Run pytest test suite
      # -v = verbose output
      # --tb=short = short traceback format
      # --strict-markers = fail on unknown markers
      # --maxfail=5 = stop after 5 failures (fail fast)
      # -x = stop on first failure (optional, commented out)
      # ------------------------------------------------------------------
      - name: Run pytest
        run: |
          pytest -v --tb=short --strict-markers --maxfail=5

      # ------------------------------------------------------------------
      # Step 8: Upload test results (optional but useful)
      # ------------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            logs/
